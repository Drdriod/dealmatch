<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Fonts load in parallel with the app instead of waiting for CSS @import. Same families as before. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
    <link rel="icon" type="image/png" sizes="96x96" href="/icon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="shortcut icon" href="/icon-96.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#C85F2D" />
    <meta name="description" content="DealMatch matches real demand with trusted supply across property, skilled trades, professional services, logistics, and more. Every listing matched, not just posted." />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DealMatch" />
    <link rel="apple-touch-icon" href="/icon-152.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="canonical" href="https://www.dealmatch.com.ng/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DealMatch" />
    <meta property="og:title" content="DealMatch: Find It, Match It, Deal" />
    <meta property="og:description" content="Tell DealMatch what you need. Real demand matched with trusted supply across property, skilled trades, professional services, logistics, and more." />
    <meta property="og:url" content="https://www.dealmatch.com.ng/" />
    <meta property="og:image" content="https://www.dealmatch.com.ng/icon-512.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DealMatch: Find It, Match It, Deal" />
    <meta name="twitter:description" content="Real demand matched with trusted supply across property, skilled trades, professional services, logistics, and more." />
    <meta name="twitter:image" content="https://www.dealmatch.com.ng/icon-512.png" />

    <title>DealMatch: Find It, Match It, Deal</title>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "DealMatch",
      "url": "https://www.dealmatch.com.ng",
      "logo": "https://www.dealmatch.com.ng/icon-512.png",
      "description": "DealMatch matches real demand with trusted supply across property, skilled trades, professional services, logistics, and more.",
      "areaServed": {
        "@type": "Country",
        "name": "Nigeria"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "DealMatch",
      "url": "https://www.dealmatch.com.ng",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://www.dealmatch.com.ng/marketplace/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
