# Weekly pull requests for out-of-date packages and GitHub Actions, so security fixes
# do not wait for someone to remember. Each one runs the normal checks before merging.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    # Vite 6+ needs a matching @vitejs/plugin-react; upgrade them together by hand.
    ignore:
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
