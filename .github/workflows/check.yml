# Runs the architecture fitness checks and the tests on every pull request, and on
# every push to main. `npm run check` is the same command to run on your own machine.
# It needs no secrets: the tests use test doubles for Supabase and Flutterwave.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Lint (undefined names, hook rules), then fitness checks 1 to 9 (module boundaries, function budget, money and column
      # rules) followed by the unit tests.
      - name: Fitness checks and tests
        run: npm run check

      # Known vulnerabilities in the packages that ship to users. Fails on high or critical only;
      # build tools (dev dependencies) are not checked here because they never reach the live site.
      - name: Dependency vulnerability scan
        run: npm audit --omit=dev --audit-level=high

      # The app must still build. The values are placeholders: the build only needs
      # them to exist, and nothing here talks to a real project.
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key

  # Browser smoke tests: the built app in real Chromium with the backend mocked at the network edge.
  # No secrets. See e2e/smoke.test.mjs.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key

      - name: Browser smoke tests
        run: npm run test:e2e
